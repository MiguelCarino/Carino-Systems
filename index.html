<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="logo.webp">
  <title>Carino Systems</title>
  <link rel="stylesheet" href="fonts/carino-fonts.css">
  <style>
    :root {
      /* Palette */
      --bg-header:      #050505;
      --bg-card:        #050505;
      --accent:         #eab308; /* Sharp Gold */
      --accent-faint:   rgba(234, 179, 8, 0.05);
      --accent-glow:    rgba(234, 179, 8, 0.15);
      --accent-dim:     rgba(234, 179, 8, 0.3);
      --border:         #262626;
      --text:           #ffffff;
      --text-sec:       #a3a3a3;
      --text-muted:     #666666;
      
      /* Stage (black & gold) */
      --bg-stage-grad:  radial-gradient(1200px 520px at 50% -12%, rgba(234,179,8,0.08) 0%, transparent 60%), linear-gradient(180deg, #0b0b0b 0%, #050505 100%);
      --text-stage-desc:  #a3a3a3;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg-header); /* Default back */
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .top-header {
      height: 70px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #0f0f0f 0%, #050505 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: relative;
      z-index: 100;
    }

    .header-left { display: flex; align-items: center; gap: 30px; }
    
    .brand-name {
      font-family: 'Red Hat Display', sans-serif;
      font-size: 1.8rem; font-weight: 900; line-height: 1;
      background: linear-gradient(130deg, #fef08a 0%, #eab308 50%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-name a { color: inherit; text-decoration: none; }
    .brand-name span { -webkit-text-fill-color: #ffffff; transition: text-shadow 0.2s; }
    .brand-self:hover span { text-shadow: 0 0 14px var(--accent-dim); }

    .header-clock { display: flex; align-items: baseline; gap: 10px; border-left: 1px solid var(--border); padding-left: 30px; }
    .clock-time { font-family: 'IBM Plex Mono', monospace; font-size: 1.2rem; color: var(--text); font-weight: 700; }
    .clock-tz { font-size: 0.65rem; color: var(--bg-header); background: var(--accent); padding: 2px 6px; border-radius: 3px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
    .brand-greeting { font-size: 0.75rem; color: var(--text-sec); font-family: 'IBM Plex Mono', monospace; margin-left: 10px;}

    .header-right { display: flex; align-items: center; gap: 15px; }
    .social-row { display: flex; gap: 8px; }
    .icon-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--border); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: 0.2s; text-decoration: none; background: transparent; cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--bg-header); background: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px var(--accent-glow); }
    .icon-btn svg { width: 15px; height: 15px; }

    .status-toggle {
      display: flex; align-items: center; gap: 8px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-sec); font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 0 16px; height: 32px; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    .status-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-faint); }
    
    .pulse-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .diag-dropdown {
      position: absolute; top: 80px; right: 30px; width: 440px; max-width: calc(100vw - 40px);
      max-height: calc(100vh - 100px); overflow-y: auto;
      background: var(--bg-card); border: 1px solid var(--accent-dim);
      padding: 20px; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      opacity: 0; pointer-events: none; transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2,0.8,0.2,1); z-index: 200;
    }
    .diag-dropdown::-webkit-scrollbar { width: 6px; }
    .diag-dropdown::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .diag-dropdown.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .diag-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; }
    .diag-lbl { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
    .diag-val { color: var(--text); text-align: right; }
    .diag-val-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
    .diag-val-group { display: flex; align-items: center; gap: 6px; }
    .diag-section { color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; margin: 12px 0 6px; opacity: 0.45; border-bottom: 1px solid var(--border); padding-bottom: 3px; }

    /* Compact single-line cells in a 3-up grid: dot + name (+ latency). The
       resolved IP is kept in the DOM but hidden — revealed on hover (cell title)
       and printed in full by the PNG export, so the panel stays short. */
    .reach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 4px; margin-bottom: 8px; }
    .reach-cell { display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 3px; padding: 3px 5px; min-width: 0; cursor: default; }
    .reach-cell .lbl { flex: 1 1 auto; min-width: 0; font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; color: var(--text-sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Latency + resolved IP stay in the DOM — the PNG export prints them full-size — but the on-screen card shows only the dot + name. */
    .reach-cell .ms, .reach-cell .ip { display: none; }
    @media (max-width: 480px) { .reach-grid { grid-template-columns: repeat(3, 1fr); } .reach-cell { padding: 4px 5px; } .reach-cell .lbl { font-size: 0.6rem; } }

    .status-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-dot.success { background: #eab308; box-shadow: 0 0 4px #eab308; }          /* reachable & responsive */
    .status-dot.slow    { background: #ffffff; box-shadow: 0 0 4px rgba(255,255,255,0.6); } /* reachable but high latency */
    .status-dot.fail    { background: #ef4444; box-shadow: 0 0 4px #ef4444; }
    .status-dot.unknown { background: #666666; }                                       /* no connection */
    .status-dot.scanning { background: #a3a3a3; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    .retry-btn {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-sec); font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 8px 0; border-radius: 4px; cursor: pointer; margin-top: 16px; width: 100%; transition: 0.2s;
    }
    .retry-btn:hover { border-color: var(--accent); color: var(--accent); }
    .retry-btn svg { width: 12px; height: 12px; }
    .diag-actions { display: flex; gap: 8px; }
    .diag-actions .retry-btn { flex: 1; }
    .complete-test-btn { text-decoration: none; margin-top: 8px; border-color: var(--accent-dim); color: var(--accent); background: var(--accent-faint); }
    .complete-test-btn:hover { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }

    /* ─────────────────────────────────────────────────────────────
       WORKSHOP INDEX

       Every tool on the page at once, filtered by typing. The hub used
       to open on five full-height category slices and nothing else, so
       the first tool was two clicks away and which slice held it was a
       guess — Metadata under MedTech, Compass under Media, and a "&
       Tools" section that had quietly become the drawer for whatever
       fit nowhere.

       Tags replaced the sections because the sections were exclusive
       and the tools are not: Metadata is a file tool AND a medical one,
       and had to lose that argument to be filed at all. Nothing is
       filed now — everything is listed, and the search box is the
       primary way in. The rail narrows; it does not hide.
       ───────────────────────────────────────────────────────────── */

    .shell { width: 100%; max-width: 1500px; margin: 0 auto; padding: 0 30px; }

    /* ── hero ── */
    .hero {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 40px; flex-wrap: wrap; padding: 46px 0 30px;
      background: var(--bg-stage-grad);
    }
    .hero-title {
      font-family: 'Red Hat Display', sans-serif; font-size: 3.4rem; font-weight: 900;
      line-height: 0.95; text-transform: uppercase; letter-spacing: 2px;
      background: linear-gradient(130deg, #fef08a 0%, #eab308 55%, #b45309 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-sub { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; color: var(--text-sec); margin-top: 10px; }
    .hero-sub b { color: var(--accent); font-weight: 700; }

    /* ── search ── */
    .search-wrap {
      position: relative; display: flex; align-items: center; gap: 12px;
      flex: 1 1 380px; max-width: 560px;
      background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px;
      padding: 0 14px; height: 54px; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-faint), 0 0 22px var(--accent-glow); }
    .search-wrap svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
    .search-wrap:focus-within svg { color: var(--accent); }
    #q {
      flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
      color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem;
    }
    #q::placeholder { color: var(--text-muted); }
    .kbd-hint {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 4px; padding: 3px 7px; flex-shrink: 0;
    }
    .search-wrap:focus-within .kbd-hint, .search-wrap.has-text .kbd-hint { display: none; }
    .q-clear {
      display: none; background: transparent; border: 0; cursor: pointer; flex-shrink: 0;
      color: var(--text-muted); font-size: 1.3rem; line-height: 1; padding: 0 2px;
    }
    .q-clear:hover { color: var(--accent); }
    .search-wrap.has-text .q-clear { display: block; }

    /* ── tag rail — the slice bar, laid flat ── */
    .rail-outer {
      position: sticky; top: 0; z-index: 60;
      background: var(--bg-header); border-bottom: 1px solid var(--border);
      border-top: 1px solid var(--border);
    }
    .rail { display: flex; overflow-x: auto; scrollbar-width: none; }
    .rail::-webkit-scrollbar { display: none; }
    .rail-btn {
      flex: 1 0 auto; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 62px; padding: 0 20px; cursor: pointer;
      background: #0a0a0a; border: 0; border-right: 1px solid var(--border);
      border-top: 3px solid transparent;
      color: var(--text-sec); font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      transition: color 0.25s, background 0.25s, border-color 0.25s;
    }
    .rail-btn:last-child { border-right: 0; }
    .rail-btn::before {
      content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.4s;
      background: radial-gradient(circle at center, var(--accent-glow) 0%, transparent 65%);
      pointer-events: none;
    }
    .rail-btn:hover { background: #131007; color: var(--text); }
    .rail-btn:hover::before { opacity: 1; }
    .rail-btn.active { background: #111111; color: var(--accent); border-top-color: var(--accent); }
    /* Not ".empty" — that class is the no-results panel below, and a bare
       .empty rule would win on source order and give this button its 70px
       padding and dashed border. */
    .rail-btn.zero { opacity: 0.3; }
    .rail-i { font-size: 1rem; line-height: 1; }
    .rail-n {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; font-weight: 700;
      color: var(--text-muted); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px;
    }
    .rail-btn.active .rail-n { color: var(--accent); border-color: var(--accent-dim); }

    /* ── results ── */
    .results {
      display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
      padding: 24px 0 4px; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;
    }
    .results b { color: var(--accent); font-weight: 700; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px; padding: 18px 0 70px;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid var(--border); padding: 22px; border-radius: 12px;
      transition: border-color 0.3s, background 0.3s, transform 0.3s, box-shadow 0.3s;
      display: flex; flex-direction: column; justify-content: space-between;
      text-decoration: none; color: inherit; min-height: 168px;
      animation: fadeUp 0.35s ease backwards;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card:hover {
      border-color: var(--accent); background: linear-gradient(145deg, #17120a 0%, #0b0b0b 100%);
      transform: translateY(-4px); box-shadow: 0 14px 28px rgba(0,0,0,0.6), 0 0 22px var(--accent-glow);
    }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .c-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .c-icon { font-size: 1.35rem; line-height: 1; }
    .c-title { font-size: 1.05rem; font-weight: 700; color: var(--text); }
    .c-desc { font-size: 0.82rem; color: var(--text-sec); line-height: 1.6; }
    .c-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .c-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .c-tag {
      font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px;
    }
    .c-tag.local { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-faint); }
    .c-link {
      font-size: 0.7rem; color: var(--accent); font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; white-space: nowrap;
    }
    /* The matched run inside a title or description — colour only, so the
       text never reflows as you type. */
    mark { background: transparent; color: var(--accent); font-weight: 700; }

    .empty {
      grid-column: 1 / -1; text-align: center; padding: 70px 20px; color: var(--text-muted);
      border: 1px dashed var(--border); border-radius: 12px;
    }
    .empty-big { font-size: 2rem; margin-bottom: 14px; opacity: 0.5; }
    .empty p { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; margin-bottom: 18px; }
    .empty button {
      background: transparent; border: 1px solid var(--accent-dim); color: var(--accent);
      font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.1em; padding: 9px 18px; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    .empty button:hover { background: var(--accent-faint); border-color: var(--accent); }

    /* ─── MOBILE ─────────────────────────────────────
       The old layout hid every text class on narrow screens and left five
       unlabelled icons on the landing page. Labels survive here; the rail
       scrolls sideways instead of dropping its words. */
    @media (max-width: 900px) {
      .header-clock { display: none; }
      .shell { padding: 0 18px; }
      .hero { padding: 32px 0 22px; }
      .hero-title { font-size: 2.4rem; }
      .search-wrap { flex-basis: 100%; height: 50px; }
      .rail-btn { flex: 0 0 auto; min-height: 54px; padding: 0 16px; font-size: 0.72rem; }
      .rail-n { display: none; }
      .grid { grid-template-columns: 1fr; gap: 14px; }
    }
    @media (max-width: 560px) {
      .top-header { padding: 0 18px; }
      .hero-title { font-size: 2rem; }
    }
  </style>
</head>
<body>

<header class="top-header">
  <div class="header-left">
    <div class="brand-name"><a href="https://carino.systems/" title="Carino Systems — back to hub">Carino</a> <a class="brand-self" href="./" title="Carino Systems — reload"><span>Systems</span></a></div>
    <div class="header-clock">
      <span class="clock-time" id="clockLocal">00:00:00</span>
      <span class="clock-tz" id="tzName">UTC</span>
      <span class="brand-greeting" id="greeting">System Ready.</span>
    </div>
  </div>

  <div class="header-right">
    <div class="social-row">
      <a href="https://github.com/MiguelCarino" target="_blank" class="icon-btn" title="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
      </a>
      <a href="https://www.linkedin.com/in/miguelcarino94/" target="_blank" class="icon-btn" title="LinkedIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
      </a>
    </div>
    
    <button class="status-toggle" onclick="toggleDiag()">
      <span data-i18n>Sys. Status</span> <div class="pulse-dot"></div>
    </button>
  </div>
</header>

<!-- Diagnostics Overlay -->
<div class="diag-dropdown" id="diagBox">
  <div class="diag-row" style="margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
    <span class="diag-lbl" data-i18n>Last Check</span>
    <span class="diag-val" id="lastCheck" style="color: var(--accent);">--:--</span>
  </div>
  <div class="diag-section"><span data-i18n>Reachability</span> <span id="reachCount" style="float:right;">--</span></div>
  <div class="reach-grid" id="reachList"></div>
  <div class="diag-section" data-i18n>Network</div>
  <div class="diag-row"><span class="diag-lbl">IPv4</span><div class="diag-val-group"><span class="diag-val" id="ipv4">...</span><span class="status-dot unknown" id="dot4"></span></div></div>
  <div class="diag-row"><span class="diag-lbl">IPv6</span><div class="diag-val-group"><span class="diag-val diag-val-trunc" id="ipv6">...</span><span class="status-dot unknown" id="dot6"></span></div></div>
  <div class="diag-row"><span class="diag-lbl">LAN</span><div class="diag-val-group"><span class="diag-val diag-val-trunc" id="lanip">...</span><span class="status-dot unknown" id="dotLan"></span></div></div>
  <div class="diag-row"><span class="diag-lbl">NAT</span><div class="diag-val-group"><span class="diag-val diag-val-trunc" id="natType">...</span><span class="status-dot unknown" id="dotNat"></span></div></div>
  <div class="diag-row"><span class="diag-lbl" data-i18n>Paths</span><div class="diag-val-group"><span class="diag-val diag-val-trunc" id="netPaths">...</span><span class="status-dot unknown" id="dotPaths"></span></div></div>
  <div class="diag-row"><span class="diag-lbl">ISP</span><span class="diag-val diag-val-trunc" id="sysISP">--</span></div>
  <div class="diag-row"><span class="diag-lbl" data-i18n>Conn</span><span class="diag-val" id="sysConn">--</span></div>
  <div class="diag-row"><span class="diag-lbl" data-i18n>Ping</span><span class="diag-val" id="pingVal">--</span></div>
  <div class="diag-row"><span class="diag-lbl" data-i18n>Speed</span><span class="diag-val" id="sysSpeed">--</span></div>
  <div class="diag-section" data-i18n>Hardware</div>
  <div class="diag-row"><span class="diag-lbl">CPU</span><span class="diag-val" id="sysCPU">--</span></div>
  <div class="diag-row"><span class="diag-lbl">RAM</span><span class="diag-val" id="sysRAM">--</span></div>
  <div class="diag-row"><span class="diag-lbl">GPU</span><span class="diag-val diag-val-trunc" id="sysGPU">--</span></div>
  <div class="diag-row"><span class="diag-lbl" data-i18n>Screen</span><span class="diag-val" id="sysScreen">--</span></div>
  <div class="diag-row"><span class="diag-lbl" data-i18n>Battery</span><span class="diag-val" id="sysBattery">--</span></div>
  <div class="diag-section" data-i18n>System</div>
  <div class="diag-row"><span class="diag-lbl" data-i18n>Client</span><span class="diag-val diag-val-trunc" id="sysClient">--</span></div>
  <div class="diag-row"><span class="diag-lbl">UTC</span><span class="diag-val" id="clockUTC">--:--Z</span></div>
  <div class="diag-row"><span class="diag-lbl">Epoch</span><span class="diag-val" id="clockEpoch">--</span></div>

    <button class="retry-btn" id="retryNetwork">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span data-i18n>Retry</span>
    </button>
    <button class="retry-btn" id="exportStatus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      <span data-i18n>Export</span>
    </button>
  </div>
  <a class="retry-btn complete-test-btn" href="https://test.carino.systems" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    <span data-i18n>Complete test</span>
  </a>
</div>


<main class="shell">

  <section class="hero">
    <div>
      <h1 class="hero-title" data-i18n>Workshop</h1>
      <p class="hero-sub" id="heroSub">&nbsp;</p>
    </div>

    <div class="search-wrap" id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search tools" />
      <span class="kbd-hint">/</span>
      <button class="q-clear" id="qClear" type="button" aria-label="Clear search">&times;</button>
    </div>
  </section>

</main>

<div class="rail-outer">
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Filter by tag"></nav>
  </div>
</div>

<main class="shell">
  <div class="results">
    <span id="resultCount">&nbsp;</span>
    <span id="resultHint"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script>
/* ─────────────────────────────────────────────────────────────────────
   The index is data, not markup: assets/json/tools.json. The hub used to
   be the only thing that knew the fleet's shape, and it knew it as 29
   hand-written <a> blocks — so a new subdomain meant editing a category
   that may not have had room for it. font.carino.systems had been live
   and unlisted for exactly that reason.

   Everything below renders from that file. Adding a tool is one object.
   ───────────────────────────────────────────────────────────────────── */

const REGISTRY = 'assets/json/tools.json';
let TOOLS = [], TAGS = [], tag = 'all', query = '';

/* i18n.js is deferred, so `t` exists by DOMContentLoaded but not before.
   Fall through to the English key until it does — which is exactly what
   t() itself does for a missing entry. */
const T = (s) => (typeof t === 'function' ? t(s) : s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── matching ──
   Space-separated terms, all of which must appear somewhere in the card:
   its name, its description, its tag labels, or its keywords — the
   unshown aliases in the registry, so "anonymize" finds the tag editor
   and "srt" finds Sync Studio without either word being on screen. */
function haystack(tool) {
  const labels = tool.tags.map((id) => tagLabel(id));
  return [tool.name, T(tool.desc), tool.keywords || '', labels.join(' '), T(labels.join(' '))]
    .join(' ').toLowerCase();
}
function terms(q) { return q.toLowerCase().split(/\s+/).filter(Boolean); }
function matches(tool, q) {
  if (!q) return true;
  const hay = haystack(tool);
  return terms(q).every((term) => hay.includes(term));
}

/* Highlight every matched run in a rendered string. Escapes first, then
   inserts <mark>, so a tool description can never smuggle in markup. */
function mark(text, q) {
  const out = esc(text);
  const ts = terms(q).filter((x) => x.length > 1);
  if (!ts.length) return out;
  const re = new RegExp('(' + ts.map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return out.replace(re, '<mark>$1</mark>');
}

function tagLabel(id) {
  const found = TAGS.find((x) => x.id === id);
  return found ? found.label : id;
}

/* ── rendering ── */
function visible() { return TOOLS.filter((x) => (tag === 'all' || x.tags.includes(tag)) && matches(x, query)); }

function renderRail() {
  const rail = document.getElementById('rail');
  // Counts respect the search but not the tag, so the rail always shows
  // where the rest of your matches are rather than going all-zero.
  const pool = TOOLS.filter((x) => matches(x, query));
  const btn = (id, icon, label, n, on) =>
    `<button class="rail-btn${on ? ' active' : ''}${n ? '' : ' zero'}" data-tag="${esc(id)}" type="button">` +
    `<span class="rail-i">${icon}</span><span>${esc(label)}</span><span class="rail-n">${n}</span></button>`;
  rail.innerHTML =
    btn('all', '✦', T('All'), pool.length, tag === 'all') +
    TAGS.map((g) => btn(g.id, g.icon, T(g.label), pool.filter((x) => x.tags.includes(g.id)).length, tag === g.id)).join('');
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const list = visible();

  document.getElementById('resultCount').innerHTML =
    T('{n} of {m} tools').replace('{n}', `<b>${list.length}</b>`).replace('{m}', TOOLS.length);
  document.getElementById('resultHint').textContent =
    list.length === 1 && query ? T('Press Enter to open') : '';

  if (!list.length) {
    grid.innerHTML =
      `<div class="empty"><div class="empty-big">⌀</div>` +
      `<p>${T('Nothing matches')} “${esc(query)}”</p>` +
      `<button type="button" id="resetBtn">${T('Show everything')}</button></div>`;
    document.getElementById('resetBtn').onclick = () => { setQuery(''); setTag('all'); };
    return;
  }

  grid.innerHTML = list.map((x, i) => {
    const chips = x.tags.map((id) => `<span class="c-tag">${esc(T(tagLabel(id)))}</span>`).join('') +
      (x.local ? `<span class="c-tag local">${esc(T('Runs locally'))}</span>` : '');
    // Only cross-origin links get a new tab, which is all of them today —
    // but the registry is meant to outlive that assumption.
    const ext = /^https?:/i.test(x.url) && !x.url.startsWith(location.origin);
    return `<a class="card" href="${esc(x.url)}"${ext ? ' target="_blank" rel="noopener"' : ''} style="animation-delay:${Math.min(i, 14) * 18}ms">
      <div>
        <div class="c-head"><span class="c-icon">${esc(x.icon)}</span><span class="c-title">${mark(x.name, query)}</span></div>
        <div class="c-desc">${mark(T(x.desc), query)}</div>
      </div>
      <div class="c-foot"><span class="c-tags">${chips}</span><span class="c-link">${esc(T(x.cta))}</span></div>
    </a>`;
  }).join('');
}

function render() {
  document.getElementById('heroSub').innerHTML =
    T('<b>{n} tools</b>, one index. Type to filter.').replace('{n}', TOOLS.length);
  document.getElementById('q').placeholder = T('Search tools…');
  renderRail();
  renderGrid();
}
// i18n.js re-runs this after a fleet-wide language switch.
window.renderTools = () => { if (TOOLS.length) render(); };

/* ── state, mirrored in the hash ──
   #medical            a tag
   #all/dicom          a search, with or without a tag ahead of it
   Tag changes push a history entry (the back button should undo a click);
   keystrokes replace it, so one search is not fifteen entries deep. */
function writeHash(push) {
  const h = '#' + tag + (query ? '/' + encodeURIComponent(query) : '');
  if (location.hash === h) return;
  if (push) location.hash = h;
  else history.replaceState(null, '', location.pathname + location.search + h);
}
function readHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  const cut = raw.indexOf('/');
  const wantTag = cut < 0 ? raw : raw.slice(0, cut);
  const wantQ = cut < 0 ? '' : raw.slice(cut + 1);
  tag = (wantTag === 'all' || TAGS.some((g) => g.id === wantTag)) ? wantTag : 'all';
  query = wantQ;
  const q = document.getElementById('q');
  if (q.value !== query) q.value = query;
  document.getElementById('searchWrap').classList.toggle('has-text', !!query);
}

function setTag(next) { tag = next; writeHash(true); render(); }
function setQuery(next) {
  query = next;
  document.getElementById('q').value = next;
  document.getElementById('searchWrap').classList.toggle('has-text', !!next);
  writeHash(false);
  render();
}

/* ── wiring ── */
function boot(data) {
  TAGS = data.tags || [];
  TOOLS = data.tools || [];
  readHash();
  render();

  document.getElementById('rail').addEventListener('click', (e) => {
    const b = e.target.closest('.rail-btn');
    if (b) setTag(b.dataset.tag);
  });

  const q = document.getElementById('q');
  q.addEventListener('input', () => setQuery(q.value));
  document.getElementById('qClear').addEventListener('click', () => { setQuery(''); q.focus(); });

  q.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (q.value) setQuery(''); else q.blur(); }
    else if (e.key === 'Enter') {
      // One result left is an unambiguous answer — take it.
      const only = visible();
      if (only.length === 1) document.querySelector('.card')?.click();
    }
  });

  // "/" anywhere puts the cursor in the box, the way every tool with a lot
  // of things in it does. Ctrl/⌘-K for the people who expect that instead.
  window.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault();
      q.focus(); q.select();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  window.addEventListener('hashchange', () => { readHash(); render(); });
}

document.addEventListener('DOMContentLoaded', () => {
  fetch(REGISTRY)
    .then((r) => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
    .then(boot)
    .catch((err) => {
      // Without the registry there is no page, so say which file is missing
      // rather than leaving an empty grid that looks like a filter result.
      document.getElementById('grid').innerHTML =
        `<div class="empty"><div class="empty-big">⚠</div><p>${esc(T('Could not load the tool index'))} — ` +
        `<code>${REGISTRY}</code><br>${esc(err.message)}</p></div>`;
      document.getElementById('resultCount').textContent = '';
    });
});

function toggleDiag() {
  document.getElementById('diagBox').classList.toggle('open');
}

document.addEventListener('click', (e) => {
  const diagBox = document.getElementById('diagBox');
  const toggleBtn = document.querySelector('.status-toggle');
  if (!diagBox.contains(e.target) && !toggleBtn.contains(e.target)) {
    diagBox.classList.remove('open');
  }
});
</script>
<script src="./carino-clock.js" defer></script>
<script src="carino-lang.js" defer></script>
<script src="i18n.js" defer></script>
<script src="./assets/js/clock-network.js"></script>
<script src="./assets/js/services.js"></script>
</body>
