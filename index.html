<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="logo.webp">
  <title>Carino Systems</title>
  <link rel="stylesheet" href="fonts/carino-fonts.css">
  <!-- Section animations: motion here, geometry in carino-anim.js. Local
       copies of the canonical pair on branding.carino.systems. -->
  <link rel="stylesheet" href="carino-anim.css">
  <style>
    :root {
      /* Palette — mirrors branding.carino.systems */
      --bg-header:      #050505;
      --bg-card:        #050505;
      --accent:         #eab308; /* Sharp Gold */
      --accent-faint:   rgba(234, 179, 8, 0.05);
      --accent-glow:    rgba(234, 179, 8, 0.15);
      --accent-dim:     rgba(234, 179, 8, 0.3);
      --border:         #262626;
      --text:           #ffffff;
      --text-sec:       #a3a3a3;
      --text-muted:     #666666;

      /* One gutter for the whole page: the shell, and anything that has to
         line up with its right edge from outside it (the diagnostics panel). */
      --shell-pad:      26px;
      /* Every row of the page is a .shell, so the notch inset is folded into
         the gutter once, here, rather than per row. --shell-pad is re-declared
         in the narrow media queries and custom properties resolve at use time,
         so these follow it down without being restated. */
      --pad-l:          var(--shell-pad);
      --pad-r:          var(--shell-pad);

      /* The type scale, from branding.carino.systems §02. Thirteen steps and
         nothing in between: every size on this page is one of these tokens.
         --fs-micro is the floor — no UI text below it, ever. The wordmark is
         the one exception the brand allows, being a display glyph. */
      --fs-micro:   0.6rem;
      --fs-label:   0.65rem;
      --fs-btn:     0.7rem;
      --fs-sm:      0.8rem;
      --fs-mono:    0.85rem;
      --fs-sec:     0.9rem;
      --fs-body:    1rem;
      --fs-lg:      1.05rem;
      --fs-h3:      1.2rem;
      --fs-h2:      1.5rem;
      --fs-h1:      1.9rem;
      --fs-display: 2.4rem;

      --tile-gap:       10px;
      --desc-lines:     2;

      /* Card material. A surface is a gradient plus two hairlines: one bright
         along the top edge where the light would land, one dark along the
         bottom. Both are inset shadows on the same element as the border, so a
         tile is still one box — no wrapper, nothing extra for fit() to measure. */
      --card:           linear-gradient(180deg, #141414 0%, #0b0b0b 58%, #090909 100%);
      --card-lit:       linear-gradient(180deg, #1b1712 0%, #0d0b09 58%, #090909 100%);
      --edge-light:     inset 0 1px 0 rgba(255,255,255,0.055);
      --edge-dark:      inset 0 -1px 0 rgba(0,0,0,0.5);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root { scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 6px; }

    /* ─────────────────────────────────────────────────────────────
       ONE SCREEN

       The hub is a way in, not a document. It used to be a hero, a
       search band, and a category carousel that walked itself every
       five seconds — three screens of chrome to reach a link, and a
       page that moved the thing you were reading.

       Now the whole fleet is on the glass at once. The page is a
       three-row grid the height of the viewport — header, command bar,
       tiles — and nothing outside a tile ever scrolls. The tile grid
       sizes itself: JS picks the column/row count whose cells land
       closest to a readable proportion and fills the space exactly, so
       filtering to four tools makes four big cards rather than four
       cards and a hole.

       Because the board IS the page, the cards have to carry the whole
       impression on their own. So they are treated as a material rather
       than as boxes: a lit top edge, a ruled field behind them, a gold
       pool that follows the cursor, and an entrance that plays when you
       change facet but never while you type. All of it is transform,
       opacity and colour — nothing an effect does can feed back into
       the fit, which measures the cell and budgets the content in it.
       ───────────────────────────────────────────────────────────── */

    html { height: 100%; }
    body {
      /* 100vh first: on an engine that does not know dvh the height would go
         unset while overflow:hidden still applied — a clipped page, not a
         degraded one. Currency's layout doctrine declares both; so does this. */
      height: 100vh; min-height: 100vh;
      height: 100dvh; min-height: 100dvh; overflow: hidden;
      display: grid; grid-template-rows: auto auto minmax(0, 1fr);
      /* minmax(0,1fr), not the implicit `auto`: an auto column grows to the
         widest row's max-content, and the facet strip's max-content is every
         chip laid end to end — which dragged the whole page 30px past the
         viewport and clipped the last tile column. */
      grid-template-columns: minmax(0, 1fr);
      background: var(--bg-header);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      /* Four layers, listed front to back. A ruled 48px field gives the black
         a sense of scale — you read it as a surface rather than as absence —
         and the two offset gold pools keep the wash from looking like one lamp
         aimed at the middle. Every layer is fixed and non-repeating, so none of
         it moves or tiles when the grid inside re-lays out. */
      background-image:
        repeating-linear-gradient(0deg,   rgba(255,255,255,0.016) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(90deg,  rgba(255,255,255,0.016) 0 1px, transparent 1px 48px),
        radial-gradient(1200px 460px at 22% -14%, rgba(234,179,8,0.085) 0%, transparent 64%),
        radial-gradient(900px 420px at 88% 6%,   rgba(234,179,8,0.045) 0%, transparent 60%);
      background-repeat: repeat, repeat, no-repeat, no-repeat;
      background-attachment: fixed;
    }

    .shell { width: 100%; max-width: 1560px; margin: 0 auto; padding: 0 var(--pad-r) 0 var(--pad-l); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ── row 1: the fleet header (brand · clock · social · diagnostics) ── */
    .top-header {
      height: 60px;                       /* the shared carino-navbar.js height */
      background: linear-gradient(180deg, #0f0f0f 0%, #070707 100%);
      border-bottom: 1px solid var(--border);
      position: relative; z-index: 100;
    }
    /* Full-bleed, NOT a .shell: the hub's header has to span the screen the way
       the shared carino-navbar.js does on every other site. Only the content
       rows below it box into the 1560px column. */
    .header-inner {
      height: 100%; position: relative;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 0 var(--pad-r) 0 var(--pad-l);
    }
    .header-left { display: flex; align-items: center; gap: 22px; min-width: 0; }

    .brand-name {
      font-family: 'Red Hat Display', sans-serif;
      font-size: var(--fs-h2); font-weight: 900; line-height: 1; white-space: nowrap;
      background: linear-gradient(130deg, #fef08a 0%, #eab308 50%, #b45309 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-name a { color: inherit; text-decoration: none; }
    .brand-name span { -webkit-text-fill-color: #ffffff; transition: text-shadow 0.2s; }
    .brand-self:hover span { text-shadow: 0 0 14px var(--accent-dim); }

    .header-clock { display: flex; align-items: baseline; gap: 10px; border-left: 1px solid var(--border); padding-left: 22px; min-width: 0; }
    .clock-time { font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-lg); color: var(--text); font-weight: 700; }
    .clock-tz { font-size: var(--fs-label); color: var(--bg-header); background: var(--accent); padding: 2px 6px; border-radius: 3px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
    .brand-greeting {
      font-size: var(--fs-sm); color: var(--text-sec); font-family: 'IBM Plex Mono', monospace;
      margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }
    /* Right-cluster slot order, fleet convention, read right-to-left:
       GitHub + LinkedIn last, language beside them, then status, then
       this app's own controls furthest from the edge. Set with `order`
       because carino-lang.js injects itself asynchronously. */
    .header-right > * { order: 1; }
    .header-right > .status-toggle { order: 2; }
    .header-right > #cnLangBtn { order: 3; }
    .header-right > .social-row { order: 4; }
    .social-row { display: flex; gap: 7px; }
    .icon-btn {
      width: 30px; height: 30px;
      border: 1px solid var(--border); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: 0.2s; text-decoration: none; background: transparent; cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--bg-header); background: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px var(--accent-glow); }
    .icon-btn svg { width: 14px; height: 14px; }

    .status-toggle {
      display: flex; align-items: center; gap: 8px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-sec); font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: 0.1em;
      padding: 0 14px; height: 30px; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    .status-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-faint); }

    .pulse-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Anchored to .header-inner, so it drops from the button that opens it —
       now the screen's right gutter, since the header is full-bleed. */
    .diag-dropdown {
      position: absolute; top: calc(100% + 9px); right: var(--pad-r); width: 440px; max-width: calc(100vw - 32px);
      max-height: calc(100vh - 86px); max-height: calc(100dvh - 86px); overflow-y: auto;
      background: var(--bg-card); border: 1px solid var(--accent-dim);
      padding: 20px; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      opacity: 0; pointer-events: none; transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2,0.8,0.2,1); z-index: 200;
    }
    .diag-dropdown::-webkit-scrollbar { width: 6px; }
    .diag-dropdown::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .diag-dropdown.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .diag-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-sm); }
    .diag-lbl { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
    .diag-val { color: var(--text); text-align: right; }
    .diag-val-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
    .diag-val-group { display: flex; align-items: center; gap: 6px; }
    .diag-section { color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-label); text-transform: uppercase; letter-spacing: 0.1em; margin: 12px 0 6px; opacity: 0.45; border-bottom: 1px solid var(--border); padding-bottom: 3px; }

    /* Compact single-line cells in a 3-up grid: dot + name (+ latency). The
       resolved IP is kept in the DOM but hidden — revealed on hover (cell title)
       and printed in full by the PNG export, so the panel stays short. */
    .reach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 4px; margin-bottom: 8px; }
    .reach-cell { display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 3px; padding: 3px 5px; min-width: 0; cursor: default; }
    .reach-cell .lbl { flex: 1 1 auto; min-width: 0; font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-label); color: var(--text-sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reach-cell .ms, .reach-cell .ip { display: none; }
    @media (max-width: 480px) { .reach-grid { grid-template-columns: repeat(3, 1fr); } .reach-cell { padding: 4px 5px; } .reach-cell .lbl { font-size: var(--fs-micro); } }

    .status-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-dot.success { background: #eab308; box-shadow: 0 0 4px #eab308; }
    .status-dot.slow    { background: #ffffff; box-shadow: 0 0 4px rgba(255,255,255,0.6); }
    .status-dot.fail    { background: #ef4444; box-shadow: 0 0 4px #ef4444; }
    .status-dot.unknown { background: #666666; }
    .status-dot.scanning { background: #a3a3a3; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    .retry-btn {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-sec); font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-btn); text-transform: uppercase; letter-spacing: 0.1em;
      padding: 8px 0; border-radius: 4px; cursor: pointer; margin-top: 16px; width: 100%; transition: 0.2s;
    }
    .retry-btn:hover { border-color: var(--accent); color: var(--accent); }
    .retry-btn svg { width: 12px; height: 12px; }
    .diag-actions { display: flex; gap: 8px; }
    .diag-actions .retry-btn { flex: 1; }
    .complete-test-btn { text-decoration: none; margin-top: 8px; border-color: var(--accent-dim); color: var(--accent); background: var(--accent-faint); }
    .complete-test-btn:hover { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }

    /* ── row 2: the command bar ──
       The only two controls on the page — type, or pick a facet — on one
       line. Categories are filters here, not a place you navigate to, so
       there is no second view to come back from. */
    .bar-outer {
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(16,16,16,0.72) 0%, rgba(8,8,8,0.72) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .bar {
      height: 54px; display: flex; align-items: center; gap: 14px; min-width: 0;
    }

    .search-wrap {
      position: relative; display: flex; align-items: center; gap: 10px; flex: 0 1 320px;
      background: linear-gradient(180deg, #131313 0%, #0b0b0b 100%);
      border: 1px solid var(--border); border-radius: 999px;
      box-shadow: var(--edge-light);
      padding: 0 14px; height: 36px; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap:focus-within {
      border-color: var(--accent-dim);
      box-shadow: var(--edge-light), 0 0 0 3px rgba(234,179,8,0.09), 0 0 22px rgba(234,179,8,0.12);
    }
    .search-wrap > svg { width: 15px; height: 15px; color: var(--text-muted); flex-shrink: 0; }
    .search-wrap:focus-within > svg { color: var(--accent); }
    #q {
      flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
      color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: var(--fs-sec);
    }
    #q::placeholder { color: var(--text-muted); }
    #q::-webkit-search-cancel-button { display: none; }
    .kbd {
      font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-label); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; line-height: 1.5;
    }
    .search-wrap:focus-within .kbd, .search-wrap.has-text .kbd { display: none; }
    .q-clear {
      display: none; background: transparent; border: 0; cursor: pointer; flex-shrink: 0;
      color: var(--text-muted); font-size: var(--fs-h3); line-height: 1; padding: 0 2px;
    }
    .q-clear:hover { color: var(--accent); }
    .search-wrap.has-text .q-clear { display: block; }

    /* The facets scroll sideways inside their own strip when they run out of
       room. The page itself never does. */
    .facets {
      display: flex; align-items: center; justify-content: flex-end; gap: 5px;
      flex: 1 1 auto; min-width: 0;
      overflow-x: auto; scrollbar-width: none; padding: 4px 2px;
    }
    .facets::-webkit-scrollbar { display: none; }
    .facet {
      display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
      background: linear-gradient(180deg, #131313 0%, #0c0c0c 100%);
      border: 1px solid var(--border); border-radius: 999px;
      box-shadow: var(--edge-light);
      color: var(--text-sec); font-family: 'IBM Plex Sans', sans-serif;
      font-size: var(--fs-sm); font-weight: 600; letter-spacing: 0.02em;
      padding: 0 11px; height: 31px; cursor: pointer; white-space: nowrap;
      transition: color 0.18s, border-color 0.18s, background 0.18s, box-shadow 0.18s, transform 0.18s;
    }
    .facet:hover {
      color: var(--text); border-color: #454545; transform: translateY(-1px);
      box-shadow: var(--edge-light), 0 4px 12px rgba(0,0,0,0.45);
    }
    .facet svg { width: 13px; height: 13px; flex-shrink: 0; transition: color 0.18s; }
    .facet:hover svg { color: var(--accent); }
    .facet .n {
      font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-label); color: var(--text-muted);
      transition: color 0.18s;
    }
    /* The selected facet is the one lit thing in the strip: gold fill, a warm
       halo under it, and the top hairline flipped to white-over-gold so it still
       reads as the same material rather than a pasted-on swatch. */
    .facet.on {
      color: #050505;
      background: linear-gradient(180deg, #f7d64a 0%, var(--accent) 55%, #c99206 100%);
      border-color: #f0cb3e;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 3px 16px rgba(234,179,8,0.28);
    }
    .facet.on:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 5px 20px rgba(234,179,8,0.34); }
    .facet.on svg, .facet.on:hover svg { color: rgba(5,5,5,0.8); }
    .facet.on .n { color: rgba(5,5,5,0.62); }
    .facet:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── row 3: every tool, at once ── */
    .board { min-height: 0; display: flex; }
    /* The vertical breathing room lives on the wrapper, never on #grid: the
       fit reads grid.clientHeight, and padding there would silently inflate it.
       Column, so the section head and mark take their own height off the top
       and bottom and #grid is left with exactly what remains. */
    .board > .shell {
      display: flex; flex-direction: column; justify-content: flex-start;
      min-width: 0; min-height: 0;
      padding: var(--tile-gap) var(--pad-r) var(--tile-gap) var(--pad-l);
    }
    #grid {
      flex: 0 0 auto; min-width: 0; min-height: 0;
      display: grid; gap: var(--tile-gap);
      /* Tracks are capped, not free — see fit(). When a filter leaves four
         tools on a 27" screen the block centres itself instead of inflating
         four cards to the height of the window. */
      justify-content: center; align-content: center; overflow: hidden;
    }
    /* Only ever reached when the viewport is too small for 31 legible cells
       — a phone in landscape, say. The grid scrolls; the page still does not. */
    #grid.overflowing { overflow-y: auto; align-content: start; }

    /* [hidden] is `display:none` from the UA sheet, which a class rule setting
       `display:flex` outranks — so off the section view these three rows kept
       their padding and quietly took ~36px off the grid. */
    .sec-head[hidden], .sec-anim[hidden], .sec-foot[hidden] { display: none; }

    /* ── the section frame ────────────────────────────────────────
       One category on the glass at a time: its name above the cards, its
       animation below them. Both rows are `auto` inside the board's column,
       so whatever they take, #grid gives up — and fit() sees the smaller box
       without being told about it. */
    .sec-head {
      flex: none; display: flex; align-items: baseline; gap: 12px;
      padding: 2px 2px 8px; min-width: 0;
    }
    .sec-head .s-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 9px var(--accent); flex: none; align-self: center;
    }
    .sec-head .s-name {
      font-family: 'Red Hat Display', sans-serif; font-weight: 900;
      font-size: var(--fs-lg); letter-spacing: 0.02em; text-transform: uppercase;
      color: var(--text); white-space: nowrap;
    }
    .sec-head .s-blurb {
      font-size: var(--fs-sm); color: var(--text-muted); min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sec-head .s-count {
      margin-left: auto; flex: none;
      font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-btn);
      letter-spacing: 0.12em; color: var(--text-muted);
    }
    .sec-head .s-count b { color: var(--accent); font-weight: 700; }

    /* The mark sits between the section's name and its tools — you meet it on
       the way in, rather than finding it after you have already read the cards. */
    .sec-anim {
      flex: none; display: flex; justify-content: center; align-items: center;
      padding: 2px 2px 10px; min-width: 0;
    }
    .sec-anim .canim { max-width: 300px; }

    .sec-foot {
      flex: none; display: flex; align-items: center; justify-content: flex-end;
      gap: 18px; padding: 12px 2px 2px; min-width: 0;
    }

    .s-next {
      flex: none; display: inline-flex; align-items: center; gap: 7px;
      background: transparent; border: 1px solid var(--border); border-radius: 999px;
      box-shadow: var(--edge-light);
      color: var(--text-muted); font-family: 'IBM Plex Mono', monospace;
      font-size: var(--fs-btn); text-transform: uppercase; letter-spacing: 0.11em;
      padding: 0 12px; height: 28px; cursor: pointer; white-space: nowrap;
      transition: color 0.18s, border-color 0.18s, background 0.18s;
    }
    .s-next:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-faint); }
    .s-next b { color: var(--text-sec); font-weight: 600; }
    .s-next:hover b { color: var(--accent); }
    .s-next .arr { transition: transform 0.18s; }
    .s-next:hover .arr { transform: translateY(2px); }

    /* Moving between sections is a step, not a scroll: the outgoing set is not
       animated out (it is replaced), the incoming one uses the tile entrance.
       This is only the band and the heading catching up with it. */
    @keyframes sec-in { from { opacity: 0; transform: translateY(6px); } }
    .board.stepping .sec-head, .board.stepping .sec-anim {
      animation: sec-in 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @media (max-width: 860px) {
      .sec-head .s-blurb { display: none; }
      .sec-anim .canim { max-width: 200px; }
      .sec-foot { gap: 12px; }
    }
    @media (max-width: 560px) {
      .sec-anim { display: none; }
      .s-next { flex: 1 1 auto; justify-content: center; }
    }

    .tile {
      position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: var(--card); border: 1px solid var(--border); border-radius: 11px;
      box-shadow: var(--edge-light), var(--edge-dark);
      padding: 11px 13px; overflow: hidden; text-decoration: none; color: inherit;
      transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
      isolation: isolate;
    }
    /* The highlight. A gold pool centred on the pointer — JS writes --mx/--my as
       percentages on the hovered tile, so the light tracks the cursor across the
       card instead of the whole card just turning on. Sits under the content
       (z-index -1 inside the tile's own stacking context) and is painted only
       while hovered, so nothing composites on the other thirty-one tiles. */
    .tile::before {
      content: ''; position: absolute; inset: -1px; z-index: -1; border-radius: inherit;
      background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%),
                  rgba(234,179,8,0.16) 0%, rgba(234,179,8,0.05) 38%, transparent 72%);
      opacity: 0; transition: opacity 0.22s;
    }
    .tile::after {
      /* The gold edge only exists when you are on the tile, and it grows out of
         the middle rather than switching on flat. */
      content: ''; position: absolute; left: 0; top: 50%; width: 2px; height: 0;
      transform: translateY(-50%);
      background: linear-gradient(180deg, transparent, var(--accent) 18%, var(--accent) 82%, transparent);
      transition: height 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .tile:hover, .tile:focus-visible {
      border-color: var(--accent-dim); background: var(--card-lit);
      transform: translateY(-3px);
      box-shadow: var(--edge-light), 0 14px 30px rgba(0,0,0,0.6), 0 0 0 1px rgba(234,179,8,0.08);
      outline: none;
    }
    .tile:hover::before, .tile:focus-visible::before { opacity: 1; }
    .tile:hover::after, .tile:focus-visible::after { height: 100%; }

    /* Tiles arrive rather than appear. The stagger is index-driven and capped in
       JS, so a 32-tool board settles in about a fifth of a second and a filtered
       four-tool board is effectively instant. Transform and opacity only — this
       runs after fit() has sized the tracks and cannot feed back into layout. */
    @keyframes tile-in { from { opacity: 0; transform: translateY(9px) scale(0.985); } }
    #grid.entering .tile {
      animation: tile-in 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: var(--d, 0ms);
    }

    .t-head { display: flex; align-items: center; gap: 9px; min-width: 0; }
    /* The icon gets a chip. Without it the card is a paragraph with a glyph in
       front; with it there is something to land on before you read anything. */
    .t-icon {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-body); line-height: 1;
      background: linear-gradient(180deg, #1e1e1e 0%, #121212 100%);
      border: 1px solid #2e2e2e;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .tile:hover .t-icon, .tile:focus-visible .t-icon {
      border-color: var(--accent-dim);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 12px rgba(234,179,8,0.18);
    }
    .t-name {
      font-family: 'Red Hat Display', 'IBM Plex Sans', sans-serif;
      font-size: var(--fs-lg); font-weight: 800; color: var(--text); line-height: 1.2;
      letter-spacing: -0.005em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }
    .t-local {
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 6px var(--accent); flex-shrink: 0; margin-left: auto;
    }
    .t-desc {
      margin-top: 5px; font-size: var(--fs-sm); color: var(--text-sec); line-height: 1.45;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--desc-lines);
      overflow: hidden; min-height: 0;
    }
    .t-foot {
      margin-top: auto; padding-top: 7px; display: flex; align-items: center;
      justify-content: space-between; gap: 8px; min-width: 0;
    }
    .t-cat {
      font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-label); text-transform: uppercase;
      letter-spacing: 0.13em; color: #5c5c5c;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: color 0.2s;
    }
    .tile:hover .t-cat, .tile:focus-visible .t-cat { color: #8a8a8a; }
    .t-go {
      font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-btn); font-weight: 600;
      letter-spacing: 0.04em; color: var(--accent);
      opacity: 0; transform: translateX(-4px); transition: 0.2s; flex-shrink: 0;
    }
    .tile:hover .t-go, .tile:focus-visible .t-go { opacity: 1; transform: none; }

    /* Cells get shorter as the fleet gets denser or the window gets smaller.
       Rather than let text spill, each step drops the least useful thing. */
    #grid.no-foot .t-foot { display: none; }
    #grid.no-desc .t-desc { display: none; }
    /* At phone density a 31-tool wall gives each name about 100px. An ellipsis
       after "Software Cat…" is not a label, so down here the name wraps to two
       lines instead of being cut. */
    #grid.tiny .tile { padding: 8px 9px; justify-content: center; }
    #grid.tiny .t-head { align-items: center; gap: 7px; }
    /* The chip shrinks rather than disappearing — at this density it is the only
       thing distinguishing one cell from the next at a glance. */
    #grid.tiny .t-icon { width: 20px; height: 20px; border-radius: 6px; font-size: var(--fs-sm); }
    #grid.tiny .t-name {
      font-size: var(--fs-btn); font-weight: 700; line-height: 1.22; white-space: normal;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    }

    .empty {
      grid-column: 1 / -1; grid-row: 1 / -1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; text-align: center;
      color: var(--text-muted); border: 1px dashed var(--border); border-radius: 12px; padding: 24px;
    }
    .empty-big { font-size: var(--fs-h1); opacity: 0.45; }
    .empty p { font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-mono); }
    .empty code { font-family: 'IBM Plex Mono', monospace; color: var(--accent); }
    .empty button {
      background: transparent; border: 1px solid var(--accent-dim); color: var(--accent);
      font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-sm); text-transform: uppercase;
      letter-spacing: 0.1em; padding: 9px 18px; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    .empty button:hover { background: var(--accent-faint); border-color: var(--accent); }

    /* The matched run inside a name or description — colour only, so the text
       never reflows as you type. */
    mark { background: transparent; color: var(--accent); font-weight: 700; }

    /* ─── NARROW ─────────────────────────────────────────────────
       Nine facets and a search box need ~1400px to sit still. Below that the
       per-facet counts go first: they are the least load-bearing thing in the
       strip, and the tiles themselves show what the filter kept. */
    @media (max-width: 1400px) { .facet .n { display: none; } }
    @media (max-width: 1080px) {
      .brand-greeting { display: none; }
    }
    @media (max-width: 860px) {
      :root { --shell-pad: 16px; }
      .header-clock { display: none; }
      .bar { height: auto; flex-direction: column; align-items: stretch; gap: 0; padding: 8px 0; }
      .search-wrap { flex: 0 0 auto; }
      /* Own row now, so the strip starts at "All" instead of ending at it. */
      .facets { padding: 8px 2px 2px; justify-content: flex-start; }
    }
    @media (max-width: 560px) {
      .brand-name { font-size: var(--fs-h3); }
      .header-left { gap: 12px; }
      .header-right { gap: 8px; }
      .status-toggle { padding: 0 10px; }
      .status-toggle span { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .board.stepping .sec-head, .board.stepping .sec-anim { animation: none; }
      .s-next:hover .arr { transform: none; }
      .tile, .t-go, .facet, .t-icon, .tile::before, .tile::after { transition: none; }
      .tile:hover, .tile:focus-visible, .facet:hover, .facet.on:hover { transform: none; }
      /* The pointer-tracked pool and the growing edge are motion, not colour —
         hovering still lights the tile, it just does not animate or follow. */
      .tile:hover::before, .tile:focus-visible::before { opacity: 1; }
      .tile:hover::after, .tile:focus-visible::after { height: 100%; }
      #grid.entering .tile { animation: none; }
    }

    /* ─── SAFE AREAS ──────────────────────────────────────────────
       A notched phone in landscape puts a cutout over the gutter and a home
       indicator over the last row. That matters more here than on a page that
       scrolls: the board is pinned to the bottom by construction, so a tile
       under the indicator cannot be scrolled back into view. */
    @supports (padding: env(safe-area-inset-left)) {
      :root {
        --pad-l: max(var(--shell-pad), env(safe-area-inset-left));
        --pad-r: max(var(--shell-pad), env(safe-area-inset-right));
      }
      /* The board is the last row now, so it carries the bottom inset. It is
         also the 1fr row, so the space comes out of the tiles' own height —
         fit() reads the shrunken clientHeight and lays out to match. */
      .board > .shell { padding-bottom: max(var(--tile-gap), env(safe-area-inset-bottom)); }
    }
  </style>
</head>

<main class="board">
  <div class="shell">
    <!-- Three rows: the section's name, its tools, and its mark. Only the
         middle one flexes, so #grid.clientHeight is what fit() budgets. -->
    <div class="sec-head" id="secHead" hidden></div>
    <div class="sec-anim" id="secAnim" hidden></div>
    <div id="grid" role="list"></div>
    <div class="sec-foot" id="secFoot" hidden></div>
  </div>

<script>
/* ─────────────────────────────────────────────────────────────────────
   Everything here lives inside one closure. clock-network.js is a classic
   script loaded after this one and it declares its own top-level `const $`
   — two of those in the shared global scope is a SyntaxError that killed
   the whole diagnostics file before it ran a line. Only the two names the
   page is called back on get published.

   The index is data, not markup: assets/json/tools.json. Adding a tool is
   one object there and one description in i18n.js — the hub itself never
   learns the fleet's shape.
   ───────────────────────────────────────────────────────────────────── */

(function () {

const REGISTRY = 'assets/json/tools.json';

let TOOLS = [], TAGS = [], tag = null, query = '', shown = [];

/* Live handle, not a one-off read: the CSS honours the preference through a
   media query, and the JS-driven motion has to honour a mid-session change too. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');

/* i18n.js is deferred, so `t` exists by DOMContentLoaded but not before.
   Fall through to the English key until it does — which is exactly what
   t() itself does for a missing entry. */
const T = (s) => (typeof t === 'function' ? t(s) : s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (id) => document.getElementById(id);

/* ── matching ──
   Space-separated terms, all of which must appear somewhere in the card:
   its name, its description, its category labels, or its keywords — the
   unshown aliases in the registry, so "anonymize" finds the tag editor
   and "srt" finds Sync Studio without either word being on screen. */
function haystack(tool) {
  const labels = tool.tags.map(tagLabel);
  return [tool.name, T(tool.desc), tool.keywords || '', labels.join(' '), T(labels.join(' '))]
    .join(' ').toLowerCase();
}
const terms = (q) => q.toLowerCase().split(/\s+/).filter(Boolean);
const matches = (tool, q) => { const hay = haystack(tool); return terms(q).every((x) => hay.includes(x)); };

/* Highlight every matched run. Escapes first, then inserts <mark>, so a
   tool description can never smuggle in markup. */
function mark(text, q) {
  const out = esc(text);
  const ts = terms(q).filter((x) => x.length > 1);
  if (!ts.length) return out;
  const re = new RegExp('(' + ts.map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return out.replace(re, '<mark>$1</mark>');
}

const cat = (id) => TAGS.find((x) => x.id === id);
const tagLabel = (id) => (cat(id) || {}).label || id;
const toolsIn = (id) => TOOLS.filter((x) => x.tags.includes(id));
function svg(d) {
  // `d` is raw SVG geometry from our own registry, not user input.
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ` +
         `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}

/* ── the board ──
   Everything that survives the current facet and the current query, and
   nothing else. The tiles are the whole page, so the list is never paged,
   sliced or rotated: if it does not fit, the cells get smaller. */
const visible = () => TOOLS.filter((x) => (!tag || x.tags.includes(tag)) && (!query || matches(x, query)));

function tileHTML(x, i) {
  // Only cross-origin links get a new tab, which is all of them today —
  // but the registry is meant to outlive that assumption.
  const ext = /^https?:/i.test(x.url) && !x.url.startsWith(location.origin);
  const cats = x.tags.map((id) => T(tagLabel(id))).join(' · ');
  const local = x.local ? `<span class="t-local" title="${esc(T('Runs locally'))}"></span>` : '';
  // --d is the entrance stagger. Capped so a 32-tool board still settles fast,
  // and so a long fleet never ends with tiles arriving after you have read them.
  const d = Math.min(i * 13, 220);
  return `<a class="tile" role="listitem" href="${esc(x.url)}" data-i="${i}" style="--d:${d}ms"${ext ? ' target="_blank" rel="noopener"' : ''}>
    <span class="t-head"><span class="t-icon">${esc(x.icon)}</span><span class="t-name">${mark(x.name, query)}</span>${local}</span>
    <span class="t-desc">${mark(T(x.desc), query)}</span>
    <span class="t-foot"><span class="t-cat">${esc(cats)}</span><span class="t-go">${esc(T(x.cta))}</span></span>
  </a>`;
}

function renderFacets() {
  const all = `<button class="facet${tag ? '' : ' on'}" data-tag="" type="button" aria-pressed="${!tag}">
      <span>${esc(T('All'))}</span><span class="n">${TOOLS.length}</span></button>`;
  $('facets').innerHTML = all + TAGS.map((g) => `
    <button class="facet${g.id === tag ? ' on' : ''}" data-tag="${esc(g.id)}" type="button"
            aria-pressed="${g.id === tag}" title="${esc(T(g.blurb))}">
      ${svg(g.path)}<span>${esc(T(g.label))}</span><span class="n">${toolsIn(g.id).length}</span>
    </button>`).join('');
}

let enterTimer = 0;
function renderGrid(animate) {
  const grid = $('grid');
  shown = visible();
  clearTimeout(enterTimer);
  grid.classList.remove('entering');
  if (!shown.length) {
    grid.className = '';
    grid.style.gridTemplateColumns = grid.style.gridTemplateRows = '1fr';
    grid.innerHTML = `<div class="empty"><div class="empty-big">&empty;</div>` +
      `<p>${esc(T('Nothing matches'))} &ldquo;${esc(query || T(tagLabel(tag)))}&rdquo;</p>` +
      `<button type="button" id="resetBtn">${esc(T('Show everything'))}</button></div>`;
    $('resetBtn').onclick = () => { setState(null, ''); $('q').focus(); };
    return;
  }
  grid.innerHTML = shown.map(tileHTML).join('');
  if (animate && !REDUCED.matches) {
    grid.classList.add('entering');
    // The class has to come off, or a tile that finishes its animation keeps
    // `both` fill and the next hover has an animation still claiming opacity.
    // Longest delay (220ms) + duration (340ms), with a little slack.
    enterTimer = setTimeout(() => grid.classList.remove('entering'), 620);
  }
  fit(true);
}

/* ── the fit ──
   The one piece of arithmetic the design rests on. Given the box the tiles
   have and how many there are, try every column count and keep the one
   whose cells land closest to a readable proportion — weighted hard against
   layouts that leave a ragged last row. Raggedness used to be a small nudge and
   it was not enough: nine tools came out 4x3, which is one card sitting alone
   under eight, and that reads as a mistake rather than as a grid. Then the grid
   is told exactly how many rows to draw, so `1fr` divides the height and
   the board fills the screen without ever exceeding it.

   A cell is capped in both directions — past a point a bigger card is not a
   better one, it is a card with a hole in it — so the tracks are written as
   minmax(0, MAX), which fills the space when there is little and stops
   growing when there is plenty. The leftovers become margin, and the board
   centres itself.

   Below a floor (cells too small to read) nothing is chosen and the grid is
   allowed to scroll inside itself — a 31-tool wall does not fit a phone in
   landscape at any legible size, and pretending otherwise is worse. */
const AR    = 2.05;  // width : height a cell reads best at
const MIN_H = 44;    // a name and nothing else
/* Both caps are flat, and deliberately so. Letting them grow for a small
   section was tried and is worse in both directions: extra height becomes a
   hole between a two-line description and the footer, and extra width lets a
   narrower column count win the score, which put nine cards into 4x3 and left
   one alone on the last row. The space a section cannot use belongs at the
   bottom of the board as whitespace, not inside the cards. */
const MAX_H = 156;   // past this a card is mostly empty
const MAX_W = 340;
let lastFit = '';
function fit(force) {
  const grid = $('grid');
  const n = shown.length;
  if (!n) return;
  const gap = parseFloat(getComputedStyle(grid).gap) || 10;
  // Measured off the ROW, not off the grid: the grid is sized by this function,
  // so reading its own height back would be circular the moment it stops
  // filling the row. What is left after the section's name and its mark is
  // what the tiles get.
  const shell = grid.parentElement, scs = getComputedStyle(shell);
  const W = grid.clientWidth;
  const H = shell.clientHeight - parseFloat(scs.paddingTop) - parseFloat(scs.paddingBottom)
          - $('secHead').offsetHeight - $('secAnim').offsetHeight - $('secFoot').offsetHeight;
  if (W < 2 || H < 2) return;
  // Same box, same tiles, same answer. Observers fire more often than the
  // layout actually changes, and re-writing the tracks is what would make
  // them fire again.
  const key = W + 'x' + H + 'x' + n;
  if (!force && key === lastFit) return;
  lastFit = key;
  const MIN_W = W < 620 ? 92 : 150;

  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const cw = Math.min(MAX_W, (W - gap * (cols - 1)) / cols);
    const ch = Math.min(MAX_H, (H - gap * (rows - 1)) / rows);
    if (cw < MIN_W || ch < MIN_H) continue;
    const score =
      Math.abs(Math.log((cw / ch) / AR)) +                    // how far from a readable proportion
      1.0 * (cols * rows - n) / n +                           // how ragged the last row is
      (1 - (cols * cw + gap * (cols - 1)) / W);               // how much of the width goes unused
    if (!best || score < best.score) best = { cols, rows, ch, score };
  }

  if (!best) {                                   // nothing legible fits — let it scroll
    const cols = Math.max(1, Math.floor((W + gap) / MIN_W));
    grid.classList.add('overflowing');
    grid.style.height = H + 'px';              // it scrolls, so it takes the lot
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows = 'none';
    grid.style.gridAutoRows = '68px';
    applyDensity(68);
    return;
  }
  grid.classList.remove('overflowing');
  // Exactly the height the chosen layout needs, so the leftover space belongs
  // to the ROW and can be shared with the heading and the animation instead of
  // being swallowed as slack inside the grid. Four tools in a tall band left
  // the mark stranded at the bottom of the screen; now the section is one
  // block, centred, with its mark directly under its cards.
  grid.style.height = (best.rows * best.ch + gap * (best.rows - 1)) + 'px';
  grid.style.gridTemplateColumns = `repeat(${best.cols}, minmax(0, ${MAX_W}px))`;
  grid.style.gridTemplateRows = `repeat(${best.rows}, 1fr)`;
  grid.style.gridAutoRows = '';
  applyDensity(best.ch);
}

/* As a cell gets shorter it drops the least useful thing it is carrying —
   the call to action, then the description — rather than clipping text. The
   line count is budgeted from what is actually left after the name, the
   padding and (if it is still there) the footer, so the clamp and the box
   agree instead of the box hiding a fifth line nobody asked for. */
/* Measured off the rendered card, not guessed — and re-measured whenever the
   card changes shape. PAD is the vertical padding plus both borders; HEAD is the
   icon chip, which is taller than the name it sits beside and therefore sets the
   row; FOOT already includes its own padding-top. */
const PAD = 24, HEAD = 26, FOOT = 21, LINE = 19, LEAD = 5;
const FIXED = PAD + HEAD + LEAD;
function applyDensity(ch) {
  const grid = $('grid');
  const foot = ch >= FIXED + LINE + FOOT;                    // keep it only if a line survives too
  const lines = Math.max(0, Math.min(5, Math.floor((ch - FIXED - (foot ? FOOT : 0)) / LINE)));
  grid.style.setProperty('--desc-lines', Math.max(1, lines));
  grid.classList.toggle('no-foot', !foot);
  grid.classList.toggle('no-desc', lines === 0);
  grid.classList.toggle('tiny', ch < 56);
}


/* ── the section frame ──
   A section is a facet you are standing in rather than one you applied: it
   names itself, it says where it sits in the set, and it carries its own
   animation. Searching leaves the frame — a query is not a place. */
const secIndex = () => TAGS.findIndex((g) => g.id === tag);
const inSection = () => !query && tag !== null;

let stepTimer = 0;
function renderFrame(animate) {
  const head = $('secHead'), anim = $('secAnim'), foot = $('secFoot');
  if (!inSection()) {
    head.hidden = anim.hidden = foot.hidden = true;
    head.innerHTML = anim.innerHTML = foot.innerHTML = '';
    return;
  }
  const at = secIndex(), g = TAGS[at], next = TAGS[(at + 1) % TAGS.length];
  head.hidden = anim.hidden = foot.hidden = false;
  head.innerHTML =
    `<span class="s-dot"></span><span class="s-name">${esc(T(g.label))}</span>` +
    `<span class="s-blurb">${esc(T(g.blurb))}</span>` +
    `<span class="s-count"><b>${at + 1}</b> / ${TAGS.length}</span>`;
  // carino-anim.js is deferred; if it has not landed the band is simply empty,
  // which costs the section its mark and nothing else.
  anim.innerHTML = window.CarinoAnim ? CarinoAnim.svg(g.id, T(g.label)) : '';
  // No dot rail: the facet strip above already lists every section, carries the
  // counts and lights the current one. This is only the "there is a next one"
  // affordance, which the strip does not give you.
  foot.innerHTML =
    `<button type="button" class="s-next" data-go="${esc(next.id)}">` +
      `${esc(T('next'))} <b>${esc(T(next.label))}</b> <span class="arr">&darr;</span></button>`;
  if (animate && !REDUCED.matches) {
    const b = document.querySelector('.board');
    clearTimeout(stepTimer);
    b.classList.remove('stepping');
    void b.offsetWidth;                    // restart the animation, do not queue it
    b.classList.add('stepping');
    // And take it off again. `both` means the animation keeps owning transform
    // for as long as the class is there, which held the heading and the mark
    // 6px low — the `from` offset — instead of letting them settle.
    stepTimer = setTimeout(() => b.classList.remove('stepping'), 400);
  }
}

/* Step by whole sections, and wrap: the set is a ring, so the last one is not
   a dead end. A query is dropped on the way — you asked to go somewhere. */
function step(delta) {
  const at = inSection() ? secIndex() : -1;
  const to = at < 0 ? (delta > 0 ? 0 : TAGS.length - 1)
                    : (at + delta + TAGS.length) % TAGS.length;
  setState(TAGS[to].id, '');
}

/* ── state ──
   #medical is a facet, #/dicom is a query, #medical/dicom is both. */
const unesc = (s) => { try { return decodeURIComponent(s); } catch { return s; } };
function readHash() {
  const raw = location.hash.replace(/^#/, '');
  const i = raw.indexOf('/');
  const asked = unesc(i < 0 ? raw : raw.slice(0, i));
  query = i < 0 ? '' : unesc(raw.slice(i + 1));
  if (TAGS.some((g) => g.id === asked)) tag = asked;
  // `#all` is the whole wall, explicitly. A bare URL is not "no section", it
  // is the first one — the hub opens somewhere rather than on everything.
  else if (asked === 'all') tag = null;
  else tag = query ? null : TAGS[0].id;
}
function writeHash() {
  const h = (tag || 'all') + (query ? '/' + encodeURIComponent(query) : '');
  history.replaceState(null, '', '#' + h);
}
/* The entrance plays on first paint and when you change facet — a deliberate
   act with a new set of tools behind it. It deliberately does NOT play while
   you type: re-running it per keystroke turns a narrowing list into a strobe. */
let animateNext = true;
function setState(nextTag, nextQuery) {
  animateNext = nextTag !== tag;
  tag = nextTag;
  query = nextQuery;
  writeHash();
  render();
}

function render() {
  $('q').placeholder = T('Search tools…');
  $('q').value = query;
  $('searchWrap').classList.toggle('has-text', !!query);
  renderFacets();
  renderFrame(animateNext);
  renderGrid(animateNext);
  animateNext = false;
}
// i18n.js re-runs this after a fleet-wide language switch.
window.renderTools = () => { if (TOOLS.length) render(); };

/* ── keyboard ──
   The grid is a grid, so the arrows are two-dimensional: left/right walk
   the list, up/down jump a row — which is only knowable after the fit. */
function columns() {
  const cs = getComputedStyle($('grid')).gridTemplateColumns;
  return Math.max(1, cs.split(' ').filter(Boolean).length);
}
function moveFocus(delta) {
  const tiles = [...$('grid').querySelectorAll('.tile')];
  if (!tiles.length) return;
  const at = tiles.indexOf(document.activeElement);
  let next = at < 0 ? (delta > 0 ? 0 : tiles.length - 1) : at + delta;
  next = Math.max(0, Math.min(tiles.length - 1, next));
  tiles[next].focus();
}

/* ── wiring ── */
function boot(data) {
  TAGS = data.tags || [];
  TOOLS = data.tools || [];
  if (!TAGS.length || !TOOLS.length) throw new Error('empty registry');

  readHash();
  render();

  $('facets').addEventListener('click', (e) => {
    const b = e.target.closest('.facet');
    if (!b) return;
    const next = b.dataset.tag || null;
    setState(next === tag ? null : next, query);      // clicking the open facet clears it
  });

  const grid = $('grid');

  /* The pointer-tracked highlight. One delegated listener for the whole board,
     coalesced into a frame — a mousemove can fire far more often than the
     compositor paints, and writing two custom properties per event is the kind
     of thing that quietly costs a frame on a 32-cell wall. Only the tile under
     the cursor is ever written to; the pool itself is painted by CSS. */
  if (!REDUCED.matches && matchMedia('(hover: hover)').matches) {
    let pending = null, queued = false;
    grid.addEventListener('pointermove', (e) => {
      const el = e.target.closest('.tile');
      if (!el) return;
      pending = { el, x: e.clientX, y: e.clientY };
      if (queued) return;                       // one write per frame, not per event
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        if (!pending) return;
        const { el: t, x, y } = pending;
        const b = t.getBoundingClientRect();
        t.style.setProperty('--mx', ((x - b.left) / b.width * 100).toFixed(1) + '%');
        t.style.setProperty('--my', ((y - b.top) / b.height * 100).toFixed(1) + '%');
        pending = null;
      });
    }, { passive: true });
    // Keyboard focus has no cursor, so centre the pool on the card instead of
    // leaving it wherever the mouse last was.
    grid.addEventListener('focusin', (e) => {
      const el = e.target.closest('.tile');
      if (el) { el.style.setProperty('--mx', '50%'); el.style.setProperty('--my', '50%'); }
    });
  }


  /* ── moving between sections ──
     The rail and the next chip both carry a target id, so one listener on the
     row handles either. Delegated, because the row is re-rendered every step. */
  $('secFoot').addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (b) setState(b.dataset.go, '');
  });

  /* A wheel is the obvious way to ask for the next one, but a trackpad sends a
     long tail of small deltas per flick. So: ignore anything under a threshold,
     then refuse to move again until the gesture has actually stopped. Without
     the cooldown one flick walks the whole ring. */
  const board = document.querySelector('.board');
  let wheelLock = 0, wheelAcc = 0, wheelIdle = 0;
  board.addEventListener('wheel', (e) => {
    if (!inSection()) return;
    // The grid scrolls inside itself when a section will not fit; that scroll
    // belongs to the grid, not to us.
    if ($('grid').classList.contains('overflowing')) return;
    e.preventDefault();
    const now = performance.now();
    if (now < wheelLock) return;
    wheelAcc += e.deltaY;
    clearTimeout(wheelIdle);
    wheelIdle = setTimeout(() => { wheelAcc = 0; }, 180);
    if (Math.abs(wheelAcc) < 40) return;
    step(wheelAcc > 0 ? 1 : -1);
    wheelAcc = 0;
    wheelLock = now + 520;
  }, { passive: false });

  // Touch: a vertical flick of more than 55px, with the same "not sideways"
  // check a carousel needs so a scrolled facet strip does not trigger it.
  let ty = 0, tx = 0;
  board.addEventListener('touchstart', (e) => {
    ty = e.touches[0].clientY; tx = e.touches[0].clientX;
  }, { passive: true });
  board.addEventListener('touchend', (e) => {
    if (!inSection() || !e.changedTouches.length) return;
    const dy = ty - e.changedTouches[0].clientY, dx = tx - e.changedTouches[0].clientX;
    if (Math.abs(dy) > 55 && Math.abs(dy) > Math.abs(dx)) step(dy > 0 ? 1 : -1);
  }, { passive: true });

  const q = $('q');
  q.addEventListener('input', () => setState(tag, q.value));
  $('qClear').addEventListener('click', () => { setState(tag, ''); q.focus(); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (q.value) setState(tag, ''); else q.blur(); }
    else if (e.key === 'Enter' && shown.length === 1) grid.querySelector('.tile').click();
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
  });

  // "/" anywhere puts the cursor in the box, the way every tool with a lot of
  // things in it does. Ctrl/⌘-K for the people who expect that instead.
  window.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault(); q.focus(); q.select(); return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    // Named `move`, not `step`: step() walks whole sections and is shadowed
    // by a local of that name.
    const move = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: columns(), ArrowUp: -columns() }[e.key];
    if (move) { e.preventDefault(); moveFocus(move); return; }
    // Pages move between sections — the arrows already belong to the grid.
    if (e.key === 'PageDown') { e.preventDefault(); step(1); }
    else if (e.key === 'PageUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'Home' && inSection()) { e.preventDefault(); setState(TAGS[0].id, ''); }
    else if (e.key === 'End' && inSection()) { e.preventDefault(); setState(TAGS[TAGS.length - 1].id, ''); }
    else if (e.key === 'Escape' && (tag || query)) setState(null, '');
  });

  // The fit is a function of the box, so it is recomputed whenever the box
  // changes — window resize, mobile URL bar, the facet strip wrapping.
  let raf = 0;
  const refit = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => fit()); };
  window.addEventListener('resize', refit);
  // Observe the ROW, not the grid: fit() writes the grid's height, so watching
  // the grid would mean watching our own output.
  if (window.ResizeObserver) new ResizeObserver(refit).observe(grid.parentElement);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  // A hidden tab gets no animation frames, so a resize that happens while the
  // window is behind another one lands here instead of never landing at all.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refit(); });

  window.addEventListener('hashchange', () => { readHash(); render(); });
}

document.addEventListener('DOMContentLoaded', () => {
  fetch(REGISTRY)
    .then((r) => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
    .then(boot)
    .catch((err) => {
      // Without the registry there is no page, so say which file is missing
      // rather than leaving an empty board that looks like a filter result.
      $('grid').innerHTML =
        `<div class="empty"><div class="empty-big">&#9888;</div><p>${esc(T('Could not load the tool index'))} — ` +
        `<code>${REGISTRY}</code><br>${esc(err.message)}</p></div>`;
      $('grid').style.gridTemplateColumns = $('grid').style.gridTemplateRows = '1fr';
    });
});

window.toggleDiag = () => $('diagBox').classList.toggle('open');

document.addEventListener('click', (e) => {
  const diagBox = $('diagBox');
  const toggleBtn = document.querySelector('.status-toggle');
  if (!diagBox.contains(e.target) && !toggleBtn.contains(e.target)) diagBox.classList.remove('open');
});

})();
</script>
<script src="./carino-clock.js" defer></script>
<script src="carino-anim.js" defer></script>
<script src="carino-lang.js" defer></script>
<script src="i18n.js" defer></script>
<script src="./assets/js/clock-network.js"></script>
<script src="./assets/js/services.js"></script>
</body>
